<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src ws://127.0.0.1:* ws://localhost:*"><title>AI Usage Deck</title>
<style>body{font:13px 'Segoe UI',sans-serif;background:#242424;color:#ddd;margin:16px}label{display:block;margin:14px 0 5px}select,button{background:#343434;color:#eee;border:1px solid #555;border-radius:5px;padding:7px;width:100%;box-sizing:border-box}small{color:#aaa;line-height:1.5}#status{margin:14px 0;padding:10px;border-left:3px solid #66dfb3;background:#303030}h3{font-size:15px;margin:0 0 10px}</style></head><body>
<h3>AI Usage Deck · Cục bộ</h3><label for="provider">Dịch vụ</label><select id="provider"><option value="claude">Claude</option><option value="codex">Codex</option><option value="antigravity">Antigravity</option></select>
<label for="window">Hạn mức</label><select id="window"><option value="fiveHour">5 giờ</option><option value="sevenDay">Tuần</option></select>
<label for="group">Nhóm quota</label><select id="group"><option value="">Nhóm mặc định</option></select>
